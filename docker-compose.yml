version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: smart-waste-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smart-waste-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-waste-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smart-waste
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - smart-waste-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-waste-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-waste-network

volumes:
  mongo-data:

networks:
  smart-waste-network:
    driver: bridge
