# ── SonarCloud Configuration ──────────────────────────────────────────
# Replace the two values below with YOUR actual values from SonarCloud
# Organization Key:  found in SonarCloud > My Account > Organizations
# Project Key:       found in SonarCloud > your project > Project Information

sonar.organization=raghavthaman
sonar.projectKey=raghavthaman_SIT223_7.3HD
sonar.projectName=Smart Waste Backend
sonar.projectVersion=1.0

# Host - must be SonarCloud, not localhost
sonar.host.url=https://sonarcloud.io

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage report path (Jest generates this with --coverage flag)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions - don't scan node_modules or generated files
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**
sonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/coverage/**
sonar.cpd.exclusions=**/tests/**